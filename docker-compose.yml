services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://board:board@postgres:5432/board?sslmode=disable
      DATA_DIR: /data
      WEB_DIR: /app/web/dist
      PORT: "8080"
    volumes:
      - boarddata:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://board:board@postgres:5432/board?sslmode=disable
      DATA_DIR: /data
      STEP_PAUSE: 2s
    volumes:
      - boarddata:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  boarddata:
